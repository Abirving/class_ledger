name: Release database
# Migrations run here as a release step rather than inside the Vercel build, so
# a cold or unreachable database can never block a deployment. Configure the
# repository secret DATABASE_URL (the Neon pooled connection string) for this
# workflow. Pushes to main run migrations, then Vercel builds and deploys.
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: npm run db:release
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
