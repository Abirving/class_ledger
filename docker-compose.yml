services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: classledger
      POSTGRES_USER: classledger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U classledger"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
  web:
    profiles: ["app"]
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://classledger:${POSTGRES_PASSWORD}@postgres:5432/classledger
      REDIS_URL: redis://redis:6379
      STORAGE_DIR: /app/private-storage
    command: ["sh", "-c", "npm run db:migrate && npm run start:postgres"]
    ports: ["127.0.0.1:3000:3000"]
    volumes: ["private-files:/app/private-storage"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  worker:
    profiles: ["app"]
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://classledger:${POSTGRES_PASSWORD}@postgres:5432/classledger
      REDIS_URL: redis://redis:6379
      STORAGE_DIR: /app/private-storage
    command: ["sh", "-c", "npm run db:migrate && npm run worker"]
    volumes: ["private-files:/app/private-storage"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
volumes:
  postgres-data:
  redis-data:
  private-files:
